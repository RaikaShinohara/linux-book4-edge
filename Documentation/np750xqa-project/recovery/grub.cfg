menuentry 'NP750XQA one CPU + firmware framebuffer (diagnostic)' {
    set root=memdisk
    echo 'Loading Linux with secondary CPUs and native DRM disabled...'
    linux /np750xqa/Image root=UUID=c2bc9dc2-bdf2-4d87-9225-7c0b6d44a52e ro rootwait console=tty0 efi=debug loglevel=8 ignore_loglevel nomodeset clk_ignore_unused pd_ignore_unused regulator_ignore_unused maxcpus=1 cpuidle.off=1 rd.log=all systemd.unit=multi-user.target
    initrd /np750xqa/initramfs.img
    echo 'Loading the NP750XQA device tree...'
