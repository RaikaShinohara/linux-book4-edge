set timeout=30
set default=0

menuentry 'NP750XQA USB test 3 - board MP1 route (default)' {
    set root=memdisk
    echo 'Loading Linux with EFI framebuffer early console...'
    linux /np750xqa/Image root=UUID=c2bc9dc2-bdf2-4d87-9225-7c0b6d44a52e ro rootwait rootdelay=90 console=tty0 consoleblank=0 earlycon=efifb keep_bootcon efi=debug,novamap loglevel=7 fw_devlink=off nomodeset clk_ignore_unused pd_ignore_unused regulator_ignore_unused rd.log=all usbcore.old_scheme_first=1 usbcore.autosuspend=-1 rootfstype=ext4 log_buf_len=4M systemd.show_status=1 systemd.unit=multi-user.target
    initrd /np750xqa/initramfs.img
    echo 'Loading the NP750XQA device tree with the experimental MP1 repeater route...'
    devicetree /np750xqa/recovery.dtb
}

menuentry 'NP750XQA USB test 3 - real-root shell before systemd' {
    set root=memdisk
    echo 'Loading external root shell; type exec /sbin/init to start systemd...'
    linux /np750xqa/Image root=UUID=c2bc9dc2-bdf2-4d87-9225-7c0b6d44a52e ro rootwait rootdelay=90 console=tty0 consoleblank=0 earlycon=efifb keep_bootcon efi=debug,novamap loglevel=7 fw_devlink=off nomodeset clk_ignore_unused pd_ignore_unused regulator_ignore_unused rd.log=all usbcore.old_scheme_first=1 usbcore.autosuspend=-1 rootfstype=ext4 log_buf_len=4M systemd.show_status=1 init=/bin/sh
    initrd /np750xqa/initramfs.img
    echo 'Loading the NP750XQA device tree with the experimental MP1 repeater route...'
    devicetree /np750xqa/recovery.dtb
}

