menuentry 'NP750XQA firmware framebuffer only (nomodeset)' {
    set root=memdisk
    echo 'Loading Linux without the native DRM hand-off...'
    linux /np750xqa/Image root=UUID=c2bc9dc2-bdf2-4d87-9225-7c0b6d44a52e ro rootwait console=tty0 efi=debug loglevel=8 ignore_loglevel nomodeset clk_ignore_unused pd_ignore_unused regulator_ignore_unused rd.log=all systemd.unit=multi-user.target
    initrd /np750xqa/initramfs.img
    echo 'Loading the NP750XQA device tree...'
    devicetree /np750xqa/board.dtb
