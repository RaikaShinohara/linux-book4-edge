set timeout=30
set default=0

menuentry 'NP750XQA USB-A premount shell (diagnostic)' {
    search --no-floppy --fs-uuid --set=root c2bc9dc2-bdf2-4d87-9225-7c0b6d44a52e
    echo 'Loading Linux; an initramfs shell should open before mounting USB root...'
    linux /boot/Image-np750xqa root=UUID=c2bc9dc2-bdf2-4d87-9225-7c0b6d44a52e ro rootwait rootdelay=5 console=tty0 efi=debug loglevel=8 ignore_loglevel nomodeset clk_ignore_unused pd_ignore_unused regulator_ignore_unused rd.debug rd.log=all break=premount usbcore.old_scheme_first=1 usbcore.autosuspend=-1
    initrd /boot/initramfs-np750xqa.img
    echo 'Loading the NP750XQA device tree with the USB-A repeater fix...'
    devicetree /boot/x1p42100-samsung-galaxy-book4-edge.dtb
}

menuentry 'NP750XQA recovery Linux (read-only first mount)' {
    search --no-floppy --fs-uuid --set=root c2bc9dc2-bdf2-4d87-9225-7c0b6d44a52e
    echo 'Loading Linux and recovery initramfs...'
    linux /boot/Image-np750xqa root=UUID=c2bc9dc2-bdf2-4d87-9225-7c0b6d44a52e ro rootwait console=tty0 efi=debug loglevel=8 ignore_loglevel drm.debug=0x1ff rd.log=all systemd.unit=multi-user.target
    initrd /boot/initramfs-np750xqa.img
    echo 'Loading the NP750XQA device tree...'
    devicetree /boot/x1p42100-samsung-galaxy-book4-edge.dtb
}

