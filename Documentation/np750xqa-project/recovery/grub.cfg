set timeout=30
set default=0

menuentry 'NP750XQA early EFI console + USB-A premount (default)' {
    set root=memdisk
    echo 'Loading Linux with EFI framebuffer early console...'
    linux /np750xqa/Image root=UUID=c2bc9dc2-bdf2-4d87-9225-7c0b6d44a52e ro rootwait rootdelay=5 console=tty0 earlycon=efifb keep_bootcon efi=debug,novamap loglevel=8 ignore_loglevel initcall_debug nomodeset clk_ignore_unused pd_ignore_unused regulator_ignore_unused rd.debug rd.log=all break=premount usbcore.old_scheme_first=1 usbcore.autosuspend=-1
    initrd /np750xqa/initramfs.img
    echo 'Loading the NP750XQA device tree with the USB-A repeater fix...'
    devicetree /np750xqa/board.dtb
}

menuentry 'NP750XQA EFI runtime disabled + early console' {
    set root=memdisk
    echo 'Loading Linux without EFI runtime services...'
    linux /np750xqa/Image root=UUID=c2bc9dc2-bdf2-4d87-9225-7c0b6d44a52e ro rootwait rootdelay=5 console=tty0 earlycon=efifb keep_bootcon efi=debug,noruntime loglevel=8 ignore_loglevel initcall_debug nomodeset clk_ignore_unused pd_ignore_unused regulator_ignore_unused rd.debug rd.log=all break=premount usbcore.old_scheme_first=1 usbcore.autosuspend=-1
    initrd /np750xqa/initramfs.img
    echo 'Loading the NP750XQA device tree...'
    devicetree /np750xqa/board.dtb
}

menuentry 'NP750XQA recovery Linux (read-only first mount)' {
    set root=memdisk
    echo 'Loading Linux and recovery initramfs...'
    linux /np750xqa/Image root=UUID=c2bc9dc2-bdf2-4d87-9225-7c0b6d44a52e ro rootwait console=tty0 efi=debug loglevel=8 ignore_loglevel drm.debug=0x1ff rd.log=all systemd.unit=multi-user.target
    initrd /np750xqa/initramfs.img
    echo 'Loading the NP750XQA device tree...'
    devicetree /np750xqa/board.dtb
}

menuentry 'NP750XQA native eDP (preserve firmware resources)' {
    set root=memdisk
    echo 'Loading Linux with native eDP and firmware resources preserved...'
